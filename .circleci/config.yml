version: 2.1

jobs:
  capacity:
    docker:
      - image: cimg/base:current
    resource_class: medium
    steps:
      - run:
          name: Measure available CPUs
          command: |
            echo "NPROC=$(nproc)"
            echo "AFFINITY=$(nproc --all)"
            grep -c '^processor' /proc/cpuinfo
            lscpu
            free -h

workflows:
  capacity:
    jobs:
      - capacity
