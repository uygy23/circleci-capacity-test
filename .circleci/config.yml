version: 2.1

parameters:
  runner_class:
    type: string
    default: medium

jobs:
  capacity:
    docker:
      - image: cimg/base:current
      - image: cimg/base:current
        command: ["bash", "-c", "openssl speed -elapsed -seconds 45 -bytes 16384 -multi 4 sha256 >/dev/null 2>&1; sleep 120"]
      - image: cimg/base:current
        command: ["bash", "-c", "openssl speed -elapsed -seconds 45 -bytes 16384 -multi 4 sha256 >/dev/null 2>&1; sleep 120"]
      - image: cimg/base:current
        command: ["bash", "-c", "openssl speed -elapsed -seconds 45 -bytes 16384 -multi 4 sha256 >/dev/null 2>&1; sleep 120"]
      - image: cimg/base:current
        command: ["bash", "-c", "openssl speed -elapsed -seconds 45 -bytes 16384 -multi 4 sha256 >/dev/null 2>&1; sleep 120"]
    resource_class: << pipeline.parameters.runner_class >>
    steps:
      - run:
          name: Measure available CPUs
          command: |
            echo "NPROC=$(nproc)"
            echo "AFFINITY=$(nproc --all)"
            grep -c '^processor' /proc/cpuinfo
            echo "CGROUP_CPU_MAX=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || true)"
            echo "CGROUP_CPUSET=$(cat /sys/fs/cgroup/cpuset.cpus.effective 2>/dev/null || true)"
            lscpu
            free -h
            openssl speed -elapsed -seconds 45 -bytes 16384 -multi 4 sha256 2>&1 | tail -n 1

workflows:
  capacity:
    jobs:
      - capacity
