version: 2.1

parameters:
  runner_class:
    type: string
    default: medium
  shards:
    type: integer
    default: 1

jobs:
  capacity:
    docker:
      - image: cimg/base:current
    resource_class: << pipeline.parameters.runner_class >>
    parallelism: << pipeline.parameters.shards >>
    steps:
      - run:
          name: Measure available CPUs
          command: |
            echo "NPROC=$(nproc)"
            echo "AFFINITY=$(nproc --all)"
            grep -c '^processor' /proc/cpuinfo
            echo "CGROUP_CPU_MAX=$(cat /sys/fs/cgroup/cpu.max 2>/dev/null || true)"
            echo "CGROUP_CPUSET=$(cat /sys/fs/cgroup/cpuset.cpus.effective 2>/dev/null || true)"
            lscpu
            free -h
            echo "SHARD=$CIRCLE_NODE_INDEX/$CIRCLE_NODE_TOTAL"
            openssl speed -elapsed -seconds 20 -bytes 16384 -multi 4 sha256 2>&1 | tail -n 1

workflows:
  capacity:
    jobs:
      - capacity
